<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Hala Madrid! - Feliz Cumpleaños</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --madrid-white: #FFFFFF;
            --madrid-gold: #FEBE10;
            --madrid-blue: #000080;
            --madrid-navy: #1C355E;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #f0f0f0 0%, #d1d1d1 100%);
            font-family: 'Oswald', sans-serif;
            color: var(--madrid-navy);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            cursor: pointer;
        }

        /* Pantalla Inicial */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(28, 53, 94, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .crest-container {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px var(--madrid-gold));
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.5rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .btn-start {
            background: var(--madrid-gold);
            color: var(--madrid-navy);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-start:hover {
            transform: scale(1.1);
            background: white;
            box-shadow: 0 0 30px var(--madrid-gold);
        }

        .btn-diff {
            background: transparent;
            color: white;
            border: 2px solid var(--madrid-gold);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-diff.active {
            background: var(--madrid-gold);
            color: var(--madrid-navy);
            font-weight: bold;
        }
        .btn-diff:hover {
            background: rgba(254, 190, 16, 0.3);
        }

        /* Juego */
        .ball {
            position: absolute;
            width: 80px;
            height: 80px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg');
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
            z-index: 100;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .score-popup {
            position: absolute;
            font-size: 3rem;
            font-weight: 900;
            color: var(--madrid-gold);
            text-shadow: 2px 2px 0 var(--madrid-navy), -2px -2px 0 var(--madrid-navy);
            pointer-events: none;
            z-index: 200;
            text-transform: uppercase;
        }

        .var-popup {
            position: absolute;
            background: #de2a2b;
            color: white;
            padding: 10px 20px;
            font-size: 2rem;
            border-radius: 5px;
            pointer-events: none;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* UI */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 500;
            pointer-events: none;
            display: none;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 30px;
            border-radius: 10px;
            border-bottom: 5px solid var(--madrid-gold);
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--madrid-navy);
        }

        /* Final */
        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            opacity: 0;
            display: none;
            z-index: 1000;
        }

        .birthday-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--madrid-navy);
            margin-bottom: 20px;
        }

        .hala-madrid {
            font-size: clamp(4rem, 12vw, 8rem);
            color: var(--madrid-blue);
            text-shadow: 4px 4px 0 var(--madrid-gold);
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .trophy {
            width: 200px;
            margin: 0 auto;
            filter: drop-shadow(0 0 30px var(--madrid-gold));
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            pointer-events: none;
        }

        /* Real Madrid Crest SVG */
        .crest-svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Overlay Inicial -->
        <div id="intro-overlay">
            <div class="crest-container">
                <svg class="crest-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#FEBE10" stroke-width="5"/>
                    <text x="50" y="60" font-family="Arial" font-size="20" fill="#FEBE10" text-anchor="middle" font-weight="bold">MCF</text>
                    <path d="M20 30 L80 70" stroke="#FEBE10" stroke-width="10" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>¡El Gran Fichaje!</h1>
            <p>Hoy celebramos los 31 años de un verdadero galáctico. <br> ¿Estás listo para marcar los goles de la victoria?</p>

            <div class="difficulty-selector" style="margin-bottom: 30px;">
                <p style="font-size: 1.1rem; margin-bottom: 10px; font-family: 'Oswald'; font-style: normal; text-transform: uppercase;">Selecciona tu nivel:</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-diff active" onclick="setDifficulty('easy', this)">Banquillo</button>
                    <button class="btn-diff" onclick="setDifficulty('medium', this)">Titular</button>
                    <button class="btn-diff" onclick="setDifficulty('hard', this)">Balón de Oro</button>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">¡A por la 16!</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-box">
                <div class="stat-label">Goles</div>
                <div id="score-val" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Objetivo</div>
                <div class="stat-value">5</div>
            </div>
            <div class="stat-box" style="border-bottom-color: #de2a2b;">
                <div class="stat-label">VAR</div>
                <div id="var-val" class="stat-value">0</div>
            </div>
        </div>

        <!-- Mensaje Final -->
        <div id="final-message">
            <h2 class="birthday-text">¡Feliz Cumpleaños Galáctico!</h2>
            <div class="trophy">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/European_Cup_trophy.svg/512px-European_Cup_trophy.svg.png" alt="Champions Trophy" style="width: 100%;">
            </div>
            <h1 class="hala-madrid">¡HALA MADRID!</h1>
            <p style="color: var(--madrid-navy); font-size: 1.8rem;">"31 años dominando el campo como los mejores."</p>
        </div>
    </div>

    <script>
        let score = 0;
        let varCount = 0;
        let targetScore = 5;
        let difficulty = 'easy';

        const diffSettings = {
            easy: { duration: [2.5, 3.5], balls: 1, target: 5 },
            medium: { duration: [1.2, 2.0], balls: 3, target: 10 },
            hard: { duration: [0.6, 1.1], balls: 5, target: 15 }
        };

        let gameActive = false;
        const container = document.getElementById('game-container');
        const hud = document.getElementById('hud');
        const scoreVal = document.getElementById('score-val');
        const varVal = document.getElementById('var-val');
        const targetVal = document.querySelectorAll('.stat-value')[1];
        const intro = document.getElementById('intro-overlay');
        const final = document.getElementById('final-message');

        function setDifficulty(level, btn) {
            difficulty = level;
            document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            targetScore = diffSettings[level].target;
            targetVal.innerText = targetScore;
        }

        function startGame() {
            gsap.to(intro, {
                opacity: 0,
                duration: 0.5,
                onComplete: () => {
                    intro.style.display = 'none';
                    hud.style.display = 'flex';
                    gameActive = true;

                    const settings = diffSettings[difficulty];
                    for(let i=0; i<settings.balls; i++) {
                        setTimeout(spawnBall, i * 500);
                    }
                }
            });
        }

        function spawnBall() {
            if (!gameActive) return;

            const ball = document.createElement('div');
            ball.className = 'ball';

            const startX = -100;
            const startY = Math.random() * (window.innerHeight - 100);

            ball.style.left = `${startX}px`;
            ball.style.top = `${startY}px`;

            container.appendChild(ball);

            // Trayectoria aleatoria basada en dificultad
            const settings = diffSettings[difficulty];
            const duration = settings.duration[0] + Math.random() * (settings.duration[1] - settings.duration[0]);

            gsap.to(ball, {
                x: window.innerWidth + 200,
                y: startY + (Math.random() - 0.5) * 400,
                rotation: 720,
                duration: duration,
                ease: "none",
                onComplete: () => {
                    if (ball.parentNode) {
                        ball.remove();
                        if (gameActive) spawnBall();
                    }
                }
            });

            ball.onclick = (e) => {
                e.stopPropagation();
                handleGoal(e.clientX, e.clientY);
                ball.remove();
            };
        }

        // Manejar clics fallidos (VAR)
        container.onclick = (e) => {
            if (!gameActive) return;
            handleMiss(e.clientX, e.clientY);
        };

        function handleGoal(x, y) {
            score++;
            scoreVal.innerText = score;

            // Popup GOOL
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.innerText = '¡GOOOOOL!';
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            container.appendChild(popup);

            gsap.to(popup, {
                y: y - 100,
                opacity: 0,
                scale: 1.5,
                duration: 1,
                onComplete: () => popup.remove()
            });

            if (score >= targetScore) {
                endGame();
            } else {
                spawnBall();
            }
        }

        function handleMiss(x, y) {
            varCount++;
            varVal.innerText = varCount;

            const varMsg = document.createElement('div');
            varMsg.className = 'var-popup';
            varMsg.innerHTML = '<span>📺</span> VAR: Peor de marrano al Vinícius';
            varMsg.style.left = `${x}px`;
            varMsg.style.top = `${y}px`;
            container.appendChild(varMsg);

            gsap.to(varMsg, {
                scale: 1.2,
                duration: 0.2,
                yoyo: true,
                repeat: 1,
                onComplete: () => {
                    gsap.to(varMsg, {
                        opacity: 0,
                        duration: 0.5,
                        delay: 0.5,
                        onComplete: () => varMsg.remove()
                    });
                }
            });
        }

        function endGame() {
            gameActive = false;
            // Limpiar pelotas
            document.querySelectorAll('.ball').forEach(b => b.remove());
            hud.style.display = 'none';

            final.style.display = 'block';
            gsap.to(final, {
                opacity: 1,
                y: -20,
                duration: 1,
                ease: "power2.out"
            });

            startConfetti();
        }

        function startConfetti() {
            const colors = ['#FEBE10', '#FFFFFF', '#000080'];
            setInterval(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = `${Math.random() * 100}%`;
                c.style.top = `-20px`;
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(c);

                gsap.to(c, {
                    y: window.innerHeight + 50,
                    x: (Math.random() - 0.5) * 200,
                    rotation: 720,
                    duration: 3 + Math.random() * 2,
                    onComplete: () => c.remove()
                });
            }, 50);
        }

        // Helper para obtener variable CSS en JS
        function getVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
</html>
