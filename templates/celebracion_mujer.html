<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebración Día de la Mujer - UIB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #005faa;
            --accent-pink: #ff69b4;
            --soft-pink: #ffe4e1;
            --gold: #d4af37;
        }

        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Playfair Display', serif;
        }

        #sky {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Plane Styling */
        .plane-wrapper {
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 10;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .paper-plane {
            width: 60px;
            height: 60px;
            fill: var(--primary-blue);
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            transition: transform 0.3s;
        }

        .plane-label {
            font-family: 'Dancing Script', cursive;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--primary-blue);
            margin-top: -10px;
            pointer-events: none;
            user-select: none;
            background: rgba(255,255,255,0.7);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .plane-wrapper:hover .paper-plane {
            transform: scale(1.1);
            fill: var(--accent-pink);
        }

        .plane-wrapper:hover .plane-label {
            color: var(--accent-pink);
        }

        /* Bouquet Styling */
        #bouquet {
            position: absolute;
            display: none;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        .flower {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
        }

        @keyframes bloom {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity: 1; }
        }

        .blooming {
            animation: bloom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Message Styling */
        #message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 30;
            pointer-events: none;
            width: 90%;
        }

        .celebration-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--accent-pink);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1), 0 0 20px rgba(255, 105, 180, 0.3);
            opacity: 0;
            transform: translateY(20px);
            line-height: 1.2;
        }

        .celebration-subtext {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-blue);
            opacity: 0;
            transform: translateY(20px);
            margin-top: 20px;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .show-message .celebration-text {
            animation: fadeInUp 2s ease-out forwards 0.5s;
        }

        .show-message .celebration-subtext {
            animation: fadeInUp 2s ease-out forwards 1.5s;
        }

        /* Confetti Effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
            z-index: 5;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="sky">
        <div id="bouquet">
            <!-- Flowers will be injected here via JS -->
        </div>

        <div id="message-container">
            <h1 class="celebration-text">Feliz Dia de la mujer a la mujer mas hermosa de mi vida</h1>
            <p class="celebration-subtext">Te amo mucho mi vida<br>Naz</p>
        </div>
    </div>

    <script>
        const sky = document.getElementById('sky');
        const bouquet = document.getElementById('bouquet');
        const messageContainer = document.getElementById('message-container');

        let siClicks = 0;
        let isFinished = false;
        const planes = [];

        class Plane {
            constructor(type) {
                this.type = type; // 'Si' or 'No'
                this.posX = -150 - (Math.random() * 500);
                this.posY = Math.random() * (window.innerHeight - 100);
                this.speed = 2 + Math.random() * 3;
                this.phase = Math.random() * Math.PI * 2;

                this.element = document.createElement('div');
                this.element.className = 'plane-wrapper';
                this.element.innerHTML = `
                    <svg class="paper-plane" viewBox="0 0 24 24">
                        <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                    </svg>
                    <div class="plane-label label-${this.type}">${this.type}</div>
                `;

                this.element.addEventListener('click', (e) => this.handleClick(e));
                sky.appendChild(this.element);
            }

            update() {
                if (isFinished) return;

                this.posX += this.speed;
                const currentY = this.posY + Math.sin(this.posX * 0.02 + this.phase) * 30;
                const angle = Math.sin(this.posX * 0.02 + this.phase) * 15;

                this.element.style.left = this.posX + 'px';
                this.element.style.top = currentY + 'px';
                this.element.style.transform = `rotate(${angle}deg)`;

                if (this.posX > window.innerWidth + 150) {
                    this.posX = -150;
                    this.posY = Math.random() * (window.innerHeight - 100);
                }
            }

            handleClick(e) {
                e.stopPropagation();
                if (isFinished) return;

                if (this.type === 'No') {
                    // Spawn more 'No' planes and 'Si' planes to fill the screen
                    for(let i=0; i<2; i++) planes.push(new Plane('No'));
                    planes.push(new Plane('Si'));

                    // Move this one back to start
                    this.posX = -150;
                    this.posY = Math.random() * (window.innerHeight - 100);
                } else {
                    siClicks++;
                    if (siClicks >= 5) {
                        finishCelebration(this.posX, this.posY);
                    } else {
                        // Move this one back to start
                        this.posX = -150;
                        this.posY = Math.random() * (window.innerHeight - 100);

                        // Add more planes as requested (3 times the same step)
                        planes.push(new Plane('Si'));
                        planes.push(new Plane('No'));
                        planes.push(new Plane('No'));
                    }
                }
            }

            remove() {
                this.element.remove();
            }
        }

        // Initial planes
        planes.push(new Plane('Si'));
        planes.push(new Plane('No'));

        function animate() {
            planes.forEach(p => p.update());
            if (!isFinished) requestAnimationFrame(animate);
        }

        animate();

        function finishCelebration(x, y) {
            isFinished = true;

            // Hide all planes
            planes.forEach(p => p.remove());

            // Show bouquet at last click position
            bouquet.style.display = 'block';
            bouquet.style.left = x + 50 + 'px';
            bouquet.style.top = y + 50 + 'px';

            createBouquet();

            // Show message
            messageContainer.style.display = 'block';
            messageContainer.classList.add('show-message');

            createConfetti();
        }

        function createBouquet() {
            const flowerColors = ['#ff69b4', '#ff1493', '#ffc0cb', '#da70d6', '#ba55d3', '#ffffff', '#ffd700'];
            const flowerCount = 40;

            for (let i = 0; i < flowerCount; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';

                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 150;
                const fx = Math.cos(angle) * radius;
                const fy = Math.sin(angle) * radius;
                const r = Math.random() * 360;

                flower.style.setProperty('--x', fx + 'px');
                flower.style.setProperty('--y', fy + 'px');
                flower.style.setProperty('--r', r + 'deg');

                const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
                const type = Math.floor(Math.random() * 3);

                let flowerSVG = '';
                if (type === 0) {
                    flowerSVG = `
                        <svg width="45" height="45" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="15" fill="#ffd700" />
                            ${[0, 45, 90, 135, 180, 225, 270, 315].map(rot =>
                                `<path d="M50,0 Q60,25 50,50 Q40,25 50,0" fill="${color}" transform="rotate(${rot} 50 50)" />`
                            ).join('')}
                        </svg>
                    `;
                } else if (type === 1) {
                    flowerSVG = `
                        <svg width="40" height="40" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="12" fill="#ffd700" />
                            ${[0, 60, 120, 180, 240, 300].map(rot =>
                                `<circle cx="50" cy="25" r="20" fill="${color}" transform="rotate(${rot} 50 50)" opacity="0.8" />`
                            ).join('')}
                        </svg>
                    `;
                } else {
                    flowerSVG = `
                        <svg width="35" height="35" viewBox="0 0 100 100">
                            <path d="M50,100 Q20,80 20,50 Q20,20 50,40 Q80,20 80,50 Q80,80 50,100" fill="${color}" />
                            <path d="M50,100 Q35,70 35,40 Q50,10 65,40 Q65,70 50,100" fill="${color}" filter="brightness(0.9)" />
                        </svg>
                    `;
                }

                flower.innerHTML = flowerSVG;
                bouquet.appendChild(flower);

                setTimeout(() => {
                    flower.classList.add('blooming');
                }, i * 40);
            }
        }

        function createConfetti() {
            const colors = ['#ff69b4', '#ff1493', '#ffd700', '#005faa', '#84c44c'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
